name = "blueline-portal"
main = "worker.js"
# Left at the date the (since-removed) assistant's SDK required. Nothing needs
# it specifically now, but the deployed Worker already runs on these semantics,
# so there's no reason to move it back and change runtime behavior.
compatibility_date = "2024-09-23"

# Create with: wrangler kv namespace create PORTAL_KV
# Then replace the id below with the id it prints.
[[kv_namespaces]]
binding = "PORTAL_KV"
id = "dadc7f3c3d66491bbc97ded5efa59bc4"

[assets]
directory = "./public"
binding = "ASSETS"

[triggers]
crons = ["*/1 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
