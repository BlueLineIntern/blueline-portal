<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/assets/blueline-logo.png" type="image/png" />
<title>Home — BlueLine Admin</title>
<link rel="stylesheet" href="/admin/shared.css?v=20260814-1" />
<style>
  .task-check { width: 16px; height: 16px; accent-color: var(--sky); cursor: pointer; margin-top: 2px; flex-shrink: 0; }
  .alert-item { display: flex; gap: var(--sp-2); padding: var(--sp-2) 0; border-bottom: 1px solid var(--border); font-size: var(--fs-xs); align-items: flex-start; }
  .alert-item:last-child { border-bottom: none; }
  .alert-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar-root"></aside>
  <main class="content">
    <div class="page-head">
      <div>
        <h1 id="dash-greeting">Home</h1>
        <p class="sub" id="dash-date"></p>
      </div>
      <div class="page-actions">
        <span class="panel-status" id="dash-status"></span>
        <button type="button" class="btn btn-ghost btn-small" id="dash-refresh">↻ Refresh</button>
      </div>
    </div>

    <div class="stat-tiles" id="stat-tiles"></div>

    <div class="home-cols">
      <!-- Left: compose a note, then the firm-wide activity stream -->
      <div>
        <div class="panel composer-panel">
          <div class="composer-tabs" id="composer-tabs">
            <button type="button" data-tab="update" class="active">Update</button>
            <button type="button" data-tab="task">Task</button>
            <button type="button" data-tab="event">Event</button>
          </div>

          <!-- Update: the @mention note composer -->
          <div class="composer-pane" id="pane-update">
            <div class="composer">
              <textarea id="composer-text" rows="2" placeholder="@Mention a contact to add a note"></textarea>
              <div class="mention-menu hidden" id="mention-menu"></div>
              <div class="composer-actions">
                <span class="composer-hint" id="composer-hint">Type @ to attach this note to a contact.</span>
                <button type="button" class="btn btn-primary btn-small" id="composer-post">Post</button>
              </div>
            </div>
          </div>

          <!-- Task -->
          <div class="composer-pane hidden" id="pane-task">
            <div class="cf-field">
              <label for="t-title">Task Name</label>
              <input type="text" id="t-title" />
            </div>
            <div class="cf-check">
              <input type="checkbox" id="t-repeats" />
              <label for="t-repeats">Repeats?</label>
              <select id="t-repeat" class="hidden">
                <option value="daily">Daily</option>
                <option value="weekly" selected>Weekly</option>
                <option value="biweekly">Every 2 weeks</option>
                <option value="monthly">Monthly</option>
                <option value="quarterly">Quarterly</option>
                <option value="yearly">Yearly</option>
              </select>
            </div>
            <div class="cf-field">
              <label for="t-duequick">Due</label>
              <div class="cf-inline">
                <select id="t-duequick">
                  <option value="today" selected>Today</option>
                  <option value="tomorrow">Tomorrow</option>
                  <option value="week">In a week</option>
                  <option value="none">No due date</option>
                  <option value="custom">Set date/time…</option>
                </select>
                <input type="datetime-local" id="t-due" class="hidden" />
              </div>
            </div>
            <div class="cf-field">
              <label for="t-assignee">Assign</label>
              <select id="t-assignee"></select>
            </div>
            <div class="cf-field">
              <label for="t-priority">Priority</label>
              <select id="t-priority"></select>
            </div>
            <div class="cf-field">
              <label for="t-category">Category</label>
              <select id="t-category"></select>
            </div>
            <div class="cf-field">
              <label for="t-client">Related To</label>
              <select id="t-client"></select>
            </div>
            <div class="cf-field">
              <label for="t-description">Description</label>
              <textarea id="t-description" rows="3" placeholder="Enter details here"></textarea>
            </div>
            <div class="composer-actions">
              <span class="composer-hint" id="t-hint"></span>
              <button type="button" class="btn btn-primary btn-small" id="t-save">Save Task</button>
            </div>
          </div>

          <!-- Event -->
          <div class="composer-pane hidden" id="pane-event">
            <div class="cf-field">
              <label for="e-title">Event Name</label>
              <input type="text" id="e-title" />
            </div>
            <div class="cf-field">
              <label for="e-category">Category</label>
              <select id="e-category"></select>
            </div>
            <div class="cf-field">
              <label for="e-start">Date</label>
              <div class="cf-inline">
                <input type="date" id="e-start" />
                <input type="time" id="e-startTime" />
                <span class="cf-to">to</span>
                <input type="date" id="e-end" />
                <input type="time" id="e-endTime" />
              </div>
            </div>
            <div class="cf-check">
              <input type="checkbox" id="e-allday" />
              <label for="e-allday">All day?</label>
            </div>
            <div class="cf-check">
              <input type="checkbox" id="e-repeats" />
              <label for="e-repeats">Repeats?</label>
              <select id="e-repeat" class="hidden">
                <option value="daily">Daily</option>
                <option value="weekly" selected>Weekly</option>
                <option value="biweekly">Every 2 weeks</option>
                <option value="monthly">Monthly</option>
                <option value="quarterly">Quarterly</option>
                <option value="yearly">Yearly</option>
              </select>
            </div>
            <div class="cf-field">
              <label for="e-status">Status</label>
              <select id="e-status">
                <option value="unconfirmed" selected>Unconfirmed</option>
                <option value="confirmed">Confirmed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <div class="cf-field">
              <label for="e-location">Location</label>
              <input type="text" id="e-location" />
            </div>
            <div class="cf-field">
              <label for="e-description">Description</label>
              <textarea id="e-description" rows="3" placeholder="Enter details here"></textarea>
            </div>
            <div class="cf-field">
              <label for="e-client">Related To</label>
              <select id="e-client"></select>
            </div>
            <div class="composer-actions">
              <span class="composer-hint" id="e-hint"></span>
              <button type="button" class="btn btn-primary btn-small" id="e-save">Save Event</button>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Workspace</h2>
            <span class="panel-status" id="feed-status"></span>
          </div>
          <div id="feed"></div>
          <button type="button" class="btn btn-ghost btn-small feed-more hidden" id="feed-more">Load older activity</button>
        </div>
      </div>

      <!-- Right rail: what needs attention, glanceable -->
      <div class="rail">
        <div class="panel">
          <div class="panel-head"><h2>Events</h2><a class="panel-link" href="/admin/calendar.html">Calendar →</a></div>
          <div class="rail-body" id="r-events"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Tasks</h2><a class="panel-link" href="/admin/operations.html">All tasks →</a></div>
          <div class="rail-body" id="r-tasks"></div>
        </div>
        <!-- Documents clients have sent in. Derived from the activity feed this
             page already fetches, so it costs no extra request. -->
        <div class="panel">
          <div class="panel-head"><h2>Client Documents</h2><span class="panel-status">recently received</span></div>
          <div class="rail-body" id="r-docs"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Special Dates</h2><span class="panel-status">next 30 days</span></div>
          <div class="rail-body" id="r-dates"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Compliance</h2><a class="panel-link" href="/admin/settings.html">Settings →</a></div>
          <div class="rail-body" id="r-alerts"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/admin/shared.js?v=20260814-1"></script>
<script>
  initShell('dashboard');

  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const who = (SESSION.email || '').split('@')[0];
  document.getElementById('dash-greeting').textContent = `${greeting}${who ? ', ' + who : ''}`;
  document.getElementById('dash-date').textContent = new Date().toLocaleDateString(undefined, {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
  });

  // isSameLocalDay / duePill / prioRailClass / categoryBadge / activityKind /
  // upcomingImportantDate / staffLabel / TL_LABELS all come from shared.js.

  let contactsCache = [];      // for the @mention picker and feed name lookups
  let adminEmails = [];        // assignable accounts for the Task form

  // Type-to-search over both "Related To" fields. Attached once at boot: the
  // picker reads the <select> it wraps and re-syncs itself when fillPickers()
  // rebuilds the options, so it does not need re-attaching on every load.
  ['t-client', 'e-client'].forEach((id) => initContactPicker(id));
  let feedCursor = null;       // server cursor for the next older page
  let feedExtra = [];          // entries pulled by "Load older activity"

  function tile(num, label, href, danger) {
    const cls = `stat-tile${danger ? ' alert' : ''}`;
    const inner = `<div class="num">${num}</div><div class="lbl">${escapeHtml(label)}</div>`;
    return href ? `<a class="${cls}" href="${href}">${inner}</a>` : `<div class="${cls}">${inner}</div>`;
  }

  function fill(id, html, emptyText) {
    document.getElementById(id).innerHTML = html || `<p class="empty">${emptyText}</p>`;
  }

  function contactName(email) {
    const c = contactsCache.find((x) => x.email === email);
    return (c && c.name) || email || '';
  }

  function clientLink(email) {
    if (!email) return '';
    return `<a href="/admin/contacts.html?c=${encodeURIComponent(email)}">${escapeHtml(contactName(email))}</a>`;
  }

  // ---------- Activity feed ----------

  // Phrased as a sentence about the record, matching how the timeline reads:
  // "<what>, related to <client>, <verb> by <staff>".
  function feedItem(e) {
    const kind = activityKind(e.type);
    const d = e.detail || {};
    // Trailing comma belongs to the clause, so it disappears with it on an
    // entry that has no client ("Title is a task created by X").
    const rel = e.client ? `, related to ${clientLink(e.client)},` : '';
    const actor = e.actor && e.actor !== 'client' && e.actor !== 'system' ? staffLabel(e.actor) : null;
    const by = actor ? ` by <strong>${escapeHtml(actor)}</strong>` : '';
    const title = escapeHtml(d.title || '(untitled)');
    let text;
    let meta = '';

    switch (e.type) {
      case 'note-added': {
        const body = String(d.body || '').trim();
        text = `A <span class="fq">note</span>${rel} was added${by}`;
        meta = body.length > 200 ? `${escapeHtml(body.slice(0, 200))}…` : escapeHtml(body);
        break;
      }
      case 'task-added':
        text = `<strong>${title}</strong>${rel} is a task created${by}`;
        break;
      case 'task-completed':
        text = `<strong>${title}</strong>${rel} has been completed${by}`;
        break;
      case 'meeting-added':
        text = `<strong>${title}</strong>${rel} is a meeting scheduled${by}`;
        break;
      case 'meeting-held':
        text = `<strong>${title}</strong>${rel} was held`;
        break;
      // Explicit cases rather than falling through to the default: these carry
      // the document in `name`, not `title`, so the generic branch would render
      // "(untitled)". Phrased with the client as the subject because they are
      // the actor here — nobody on staff did this.
      case 'document-uploaded': {
        const docName = escapeHtml(d.name || d.filename || 'a document');
        text = `${clientLink(e.client) || 'A client'} sent <span class="fq">${docName}</span>`;
        meta = d.filename && d.filename !== d.name ? escapeHtml(d.filename) : '';
        break;
      }
      case 'document-requested':
        text = `<strong>${escapeHtml(d.label || 'A document')}</strong> was requested`
          + `${e.client ? ` from ${clientLink(e.client)}` : ''}${by}`;
        break;
      default: {
        const label = TL_LABELS[e.type] || e.type;
        text = `${clientLink(e.client) || 'Someone'} ${escapeHtml(label)}`;
        const extra = d.module || d.onboardingId;
        if (extra) meta = escapeHtml(extra);
      }
    }

    return `<div class="feed-item">
      <div class="feed-icon ${kind.cls}">${kind.icon}</div>
      <div class="feed-main">
        <div class="feed-text">${text}</div>
        ${meta ? `<div class="feed-meta">${meta}</div>` : ''}
      </div>
      <div class="feed-time">${escapeHtml(relTime(e.ts))}</div>
    </div>`;
  }

  function renderFeed(entries) {
    const all = entries.concat(feedExtra);
    fill('feed', all.map(feedItem).join(''), 'No activity yet. Notes, tasks and client milestones appear here.');
    document.getElementById('feed-more').classList.toggle('hidden', !feedCursor);
  }

  document.getElementById('feed-more').addEventListener('click', async (ev) => {
    const btn = ev.currentTarget;
    if (!feedCursor) return;
    btn.disabled = true;
    btn.textContent = 'Loading…';
    try {
      const page = await api(`/api/admin/activity?cursor=${encodeURIComponent(feedCursor)}`);
      feedExtra = feedExtra.concat(page.entries || []);
      feedCursor = page.cursor || null;
      load();
    } catch (err) {
      document.getElementById('feed-status').textContent = `Could not load more: ${err.message}`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Load older activity';
    }
  });

  // ---------- @mention composer ----------

  const textEl = document.getElementById('composer-text');
  const menuEl = document.getElementById('mention-menu');
  const hintEl = document.getElementById('composer-hint');
  let mentioned = null;   // {email, name} chosen from the picker
  let menuMatches = [];
  let menuIndex = 0;

  function setHint(msg, isErr) {
    hintEl.textContent = msg;
    hintEl.classList.toggle('err', !!isErr);
  }

  function closeMenu() {
    menuEl.classList.add('hidden');
    menuMatches = [];
  }

  // The active @token is the one immediately left of the caret. Anchoring to the
  // caret (not the last @ in the string) keeps the picker correct when the
  // advisor goes back and edits a mention mid-sentence.
  function activeMentionQuery() {
    const pos = textEl.selectionStart;
    const upto = textEl.value.slice(0, pos);
    const at = upto.lastIndexOf('@');
    if (at === -1) return null;
    const frag = upto.slice(at + 1);
    if (/[\n]/.test(frag)) return null;
    return { at, query: frag };
  }

  function renderMenu() {
    if (!menuMatches.length) return closeMenu();
    menuEl.innerHTML = menuMatches
      .map(
        (c, i) =>
          `<button type="button" data-i="${i}" class="${i === menuIndex ? 'sel' : ''}">${escapeHtml(c.name || c.email)}<span class="mm-sub">${escapeHtml(c.email)}</span></button>`
      )
      .join('');
    menuEl.classList.remove('hidden');
  }

  function pick(i) {
    const c = menuMatches[i];
    if (!c) return;
    const m = activeMentionQuery();
    if (!m) return;
    const pos = textEl.selectionStart;
    const label = c.name || c.email;
    textEl.value = `${textEl.value.slice(0, m.at)}@${label} ${textEl.value.slice(pos)}`;
    mentioned = { email: c.email, name: label };
    closeMenu();
    textEl.focus();
    setHint(`This note will be filed to ${label}.`);
  }

  textEl.addEventListener('input', () => {
    // A mention only counts while its label is still present in the text — if
    // the advisor deletes it, the note loses its target rather than silently
    // filing to a contact whose name is no longer on screen.
    if (mentioned && !textEl.value.includes(`@${mentioned.name}`)) {
      mentioned = null;
      setHint('Type @ to attach this note to a contact.');
    }
    const m = activeMentionQuery();
    if (!m) return closeMenu();
    const q = m.query.trim().toLowerCase();
    menuMatches = contactsCache
      .filter((c) => !c.archived)
      .filter((c) => !q || (c.name || '').toLowerCase().includes(q) || c.email.toLowerCase().includes(q))
      .slice(0, 6);
    menuIndex = 0;
    renderMenu();
  });

  textEl.addEventListener('keydown', (ev) => {
    if (menuEl.classList.contains('hidden')) return;
    if (ev.key === 'ArrowDown') { ev.preventDefault(); menuIndex = (menuIndex + 1) % menuMatches.length; renderMenu(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); menuIndex = (menuIndex - 1 + menuMatches.length) % menuMatches.length; renderMenu(); }
    else if (ev.key === 'Enter' || ev.key === 'Tab') { ev.preventDefault(); pick(menuIndex); }
    else if (ev.key === 'Escape') { closeMenu(); }
  });

  menuEl.addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-i]');
    if (btn) pick(Number(btn.dataset.i));
  });

  document.addEventListener('click', (ev) => {
    if (!menuEl.contains(ev.target) && ev.target !== textEl) closeMenu();
  });

  document.getElementById('composer-post').addEventListener('click', async (ev) => {
    const body = textEl.value.trim();
    if (!body) return setHint('Write something first.', true);
    if (!mentioned) return setHint('Mention a contact with @ so the note has somewhere to file.', true);
    const btn = ev.currentTarget;
    btn.disabled = true;
    try {
      await api('/api/admin/notes', {
        method: 'POST',
        body: JSON.stringify({ client: mentioned.email, body }),
      });
      textEl.value = '';
      mentioned = null;
      setHint('Note posted.');
      load();
    } catch (err) {
      setHint(`Could not post: ${err.message}`, true);
    } finally {
      btn.disabled = false;
    }
  });

  // ---------- Composer tabs: Update / Task / Event ----------

  document.getElementById('composer-tabs').addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-tab]');
    if (!btn) return;
    [...ev.currentTarget.children].forEach((b) => b.classList.toggle('active', b === btn));
    ['update', 'task', 'event'].forEach((t) =>
      document.getElementById(`pane-${t}`).classList.toggle('hidden', t !== btn.dataset.tab)
    );
  });

  // "Repeats?" reveals the interval picker — an unchecked box means one-off,
  // which the API represents as an empty repeat rather than a missing field.
  const wireRepeat = (boxId, selId) => {
    const box = document.getElementById(boxId);
    box.addEventListener('change', () =>
      document.getElementById(selId).classList.toggle('hidden', !box.checked)
    );
  };
  wireRepeat('t-repeats', 't-repeat');
  wireRepeat('e-repeats', 'e-repeat');

  // Quick-pick due dates. "Set date/time…" swaps in a real picker so the common
  // case stays one click without giving up an exact timestamp when it matters.
  const dueQuick = document.getElementById('t-duequick');
  dueQuick.addEventListener('change', () =>
    document.getElementById('t-due').classList.toggle('hidden', dueQuick.value !== 'custom')
  );

  // Local-time formatting: toISOString() would shift a late-evening due date to
  // the next day for anyone west of UTC, so build the string from local parts.
  const pad = (n) => String(n).padStart(2, '0');
  const localDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  function resolveTaskDue() {
    const now = new Date();
    switch (dueQuick.value) {
      case 'today': return localDate(now);
      case 'tomorrow': return localDate(new Date(now.getTime() + 86400e3));
      case 'week': return localDate(new Date(now.getTime() + 7 * 86400e3));
      case 'none': return '';
      case 'custom': return document.getElementById('t-due').value || '';
      default: return '';
    }
  }

  // Contact picker shared by both forms. Rebuilt whenever contacts reload so a
  // newly synced client is selectable without a page refresh.
  //
  // Split into Clients and Prospects, matching the task drawer on Operations —
  // a task related to "Dana Reed" reads very differently depending on which side
  // of the pipeline she is on. Same rule as contactIsProspect() there: a record
  // with no status at all is the 'prospect' default buildContactList() applies,
  // but this list only ever holds records we actually loaded, so there is no
  // unknown-email case to guard here.
  function fillPickers() {
    const clients = [];
    const prospects = [];
    contactsCache.forEach((c) => {
      ((c.status || 'prospect') === 'prospect' ? prospects : clients).push(c);
    });
    const optHtml = (c) => `<option value="${escapeHtml(c.email)}">${escapeHtml(c.name || c.email)}</option>`;
    const group = (label, list) => (list.length ? `<optgroup label="${escapeHtml(label)}">${list.map(optHtml).join('')}</optgroup>` : '');
    const opts = '<option value="">— none —</option>' + group('Clients', clients) + group('Prospects', prospects);
    ['t-client', 'e-client'].forEach((id) => {
      const el = document.getElementById(id);
      const keep = el.value;
      // A task already related to someone who has since been archived (and so
      // dropped from contactsCache) keeps them listed, or `el.value = keep`
      // silently fails and the form quietly reports the wrong contact.
      const missing = keep && !contactsCache.some((c) => c.email === keep)
        ? `<option value="${escapeHtml(keep)}">${escapeHtml(keep)} (unavailable)</option>`
        : '';
      el.innerHTML = opts + missing;
      if (keep) el.value = keep;
    });
    const assignee = document.getElementById('t-assignee');
    if (!assignee.options.length) {
      assignee.innerHTML = '<option value="">— unassigned —</option>' +
        adminEmails.map((a) =>
          `<option value="${escapeHtml(a)}"${a === SESSION.email ? ' selected' : ''}>${escapeHtml(staffLabel(a))}</option>`
        ).join('');
    }
    const prio = document.getElementById('t-priority');
    if (!prio.options.length) prio.innerHTML = priorityOptions('medium');
    const tcat = document.getElementById('t-category');
    if (!tcat.options.length) tcat.innerHTML = categoryOptions('');
    const ecat = document.getElementById('e-category');
    if (!ecat.options.length) ecat.innerHTML = categoryOptions('meeting');
  }

  // Both category pickers offer "Create new category…"; resolve the sentinel
  // into a real option the same way the contacts and operations pages do.
  ['t-category', 'e-category'].forEach((id) => {
    const sel = document.getElementById(id);
    sel.addEventListener('change', () => {
      if (sel.value !== NEW_CATEGORY_VALUE) return;
      const name = promptNewCategoryName();
      if (!name) { sel.value = ''; return; }
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      sel.insertBefore(opt, sel.querySelector(`option[value="${NEW_CATEGORY_VALUE}"]`));
      sel.value = name;
    });
  });

  const setFormHint = (id, msg, isErr) => {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.toggle('err', !!isErr);
  };

  document.getElementById('t-save').addEventListener('click', async (ev) => {
    const title = document.getElementById('t-title').value.trim();
    if (!title) return setFormHint('t-hint', 'Give the task a name.', true);
    const category = document.getElementById('t-category').value;
    if (category === NEW_CATEGORY_VALUE) return setFormHint('t-hint', 'Name the new category first.', true);
    const btn = ev.currentTarget;
    btn.disabled = true;
    try {
      await api('/api/admin/tasks', {
        method: 'POST',
        body: JSON.stringify({
          title,
          due: resolveTaskDue(),
          repeat: document.getElementById('t-repeats').checked ? document.getElementById('t-repeat').value : '',
          assignee: document.getElementById('t-assignee').value,
          priority: document.getElementById('t-priority').value || 'medium',
          category,
          client: document.getElementById('t-client').value,
          description: document.getElementById('t-description').value.trim(),
        }),
      });
      document.getElementById('t-title').value = '';
      document.getElementById('t-description').value = '';
      document.getElementById('t-repeats').checked = false;
      document.getElementById('t-repeat').classList.add('hidden');
      setFormHint('t-hint', 'Task created.');
      load();
    } catch (err) {
      setFormHint('t-hint', `Could not save: ${err.message}`, true);
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('e-save').addEventListener('click', async (ev) => {
    const title = document.getElementById('e-title').value.trim();
    if (!title) return setFormHint('e-hint', 'Give the event a name.', true);
    const category = document.getElementById('e-category').value;
    if (category === NEW_CATEGORY_VALUE) return setFormHint('e-hint', 'Name the new category first.', true);
    const startDate = document.getElementById('e-start').value;
    if (!startDate) return setFormHint('e-hint', 'Pick a start date.', true);
    const allDay = document.getElementById('e-allday').checked;
    const startTime = document.getElementById('e-startTime').value;
    const endDate = document.getElementById('e-end').value;
    const endTime = document.getElementById('e-endTime').value;
    // An all-day event carries date only; the same date-vs-datetime distinction
    // the server already uses to advance a recurring due date.
    const due = allDay || !startTime ? startDate : `${startDate}T${startTime}`;
    const endDue = !endDate ? '' : (allDay || !endTime ? endDate : `${endDate}T${endTime}`);
    if (endDue && endDue < due) return setFormHint('e-hint', 'The event ends before it starts.', true);
    const btn = ev.currentTarget;
    btn.disabled = true;
    try {
      await api('/api/admin/tasks', {
        method: 'POST',
        body: JSON.stringify({
          title,
          category,
          due,
          endDue,
          allDay,
          eventStatus: document.getElementById('e-status').value,
          location: document.getElementById('e-location').value.trim(),
          repeat: document.getElementById('e-repeats').checked ? document.getElementById('e-repeat').value : '',
          description: document.getElementById('e-description').value.trim(),
          client: document.getElementById('e-client').value,
        }),
      });
      document.getElementById('e-title').value = '';
      document.getElementById('e-location').value = '';
      document.getElementById('e-description').value = '';
      document.getElementById('e-repeats').checked = false;
      document.getElementById('e-repeat').classList.add('hidden');
      setFormHint('e-hint', 'Event created.');
      load();
    } catch (err) {
      setFormHint('e-hint', `Could not save: ${err.message}`, true);
    } finally {
      btn.disabled = false;
    }
  });

  // ---------- Load ----------

  async function load() {
    try {
      const [contactData, taskData, actData, onbData, adminData] = await Promise.all([
        api('/api/admin/contacts'),
        api('/api/admin/tasks'),
        api('/api/admin/activity'),
        api('/api/admin/onboarding').catch(() => ({ records: [] })),
        api('/api/admin/admins').catch(() => ({ admins: [] })),
      ]);
      // Archived contacts are hidden from every count, queue and alert.
      const contacts = (contactData.contacts || []).filter((c) => !c.archived);
      contactsCache = contacts;
      adminEmails = contactData.admins || [];
      registerStaff(Object.entries(contactData.adminNames || {}).map(([id, name]) => ({ id, name })));
      fillPickers();
      // Default the event start to today the first time the form is built, so
      // the common "book something for today" path needs no date entry.
      const eStart = document.getElementById('e-start');
      if (!eStart.value) { eStart.value = localDate(new Date()); document.getElementById('e-end').value = eStart.value; }
      const openTasks = (taskData.tasks || []).filter((t) => t.status === 'open');
      const onbs = (onbData.records || []).filter((r) => !r.deleted);
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      // ----- Stat tiles -----
      const byStatus = (s) => contacts.filter((c) => c.status === s).length;
      // "Onboarding" counts people actually mid-wizard rather than contacts an
      // advisor manually flagged (which nobody did, so the tile always read 0).
      // Deduped by email because the tile counts people, not submissions; a
      // session too early to have captured an email still counts as one person.
      const onboardingEmails = new Set();
      let onboardingAnon = 0;
      onbs.filter((r) => !r.completionTime).forEach((r) => {
        const d = r.data || {};
        const email = String((d.profile && d.profile.email) || (d.consent && d.consent.email) || '').trim().toLowerCase();
        if (email) onboardingEmails.add(email);
        else onboardingAnon += 1;
      });
      const onboardingCount = onboardingEmails.size + onboardingAnon;
      const dueToday = openTasks.filter((t) => t.due && isSameLocalDay(new Date(t.due), now));
      const overdue = openTasks.filter((t) => t.due && new Date(t.due) < now && !isSameLocalDay(new Date(t.due), now));
      document.getElementById('stat-tiles').innerHTML = [
        tile(byStatus('active'), 'Active Clients', '/admin/contacts.html'),
        tile(byStatus('prospect'), 'Prospects', '/admin/contacts.html?seg=prospects'),
        tile(onboardingCount, 'Onboarding', '/admin/onboarding.html'),
        tile(dueToday.length, 'Due Today', '/admin/operations.html?filter=today'),
        tile(overdue.length, 'Overdue', '/admin/operations.html?filter=overdue', overdue.length > 0),
      ].join('');

      // ----- Feed (page 1 from the server, plus anything paged in) -----
      feedCursor = actData.cursor || null;
      renderFeed(actData.entries || []);

      // ----- Events: meetings in the next 7 days -----
      const meetings = openTasks
        .filter((t) => t.category === 'meeting' && t.due)
        .filter((t) => {
          const d = new Date(t.due);
          return !isNaN(d) && d >= startOfToday && d - startOfToday < 7 * 86400e3;
        })
        .sort((a, b) => new Date(a.due) - new Date(b.due));
      fill(
        'r-events',
        meetings
          .map((m) => {
            const d = new Date(m.due);
            const when = String(m.due).includes('T')
              ? d.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })
              : d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
            return `<a class="rail-row" style="text-decoration:none;color:inherit" href="/admin/calendar.html?task=${encodeURIComponent(m.id)}&view=day&date=${escapeHtml(String(m.due).slice(0, 10))}">
              <div class="rr-main">
                <div>${escapeHtml(m.title)}</div>
                <div class="rr-sub">${m.client ? escapeHtml(contactName(m.client)) : 'Internal'} · ${escapeHtml(when)}</div>
              </div>
            </a>`;
          })
          .join(''),
        'No events in the next 7 days.'
      );

      // ----- Tasks: overdue first, then today. Checkbox completes in place. -----
      // Meetings are tasks too (category: 'meeting'), but the Events panel right
      // above already lists them — showing one here as well would duplicate the
      // same record in two adjacent panels, tickable from either. Same call
      // contacts.html's Tasks tab already makes for the same reason.
      const railOverdue = overdue.filter((t) => t.category !== 'meeting');
      const railDueToday = dueToday.filter((t) => t.category !== 'meeting');
      // One flowing line per task: [badge] Title — related to Client. The group
      // heading (Overdue / Due today) already states the urgency in words, so
      // the row itself carries no urgency colour; a coloured edge bar here just
      // restated the heading in a second, competing hue.
      // A task already ticked off on the Tasks page shows struck through here so
      // the rail doesn't read as though nobody has touched it. The checkbox still
      // completes in one press: a two-step gate belongs on the Tasks page, not on
      // a compact rail row where the second control has nowhere to go.
      const railTask = (t) => `<div class="rail-row ${t.readyAt ? 'task-ready' : ''}">
        <input type="checkbox" class="task-check" data-id="${escapeHtml(t.id)}" title="${t.readyAt ? 'Ticked off on the Tasks page — completes it' : 'Mark complete'}" />
        <div class="rr-main">
          ${t.category ? categoryBadge(t.category) + ' ' : ''}<a class="rr-title" href="/admin/contacts.html?c=${encodeURIComponent(t.client || '')}&tab=tasks">${escapeHtml(t.title)}</a>${t.client ? ` <span class="rr-rel">related to</span> ${clientLink(t.client)}` : ''}
        </div>
      </div>`;
      const taskHtml =
        (railOverdue.length ? `<div class="rail-group">Overdue</div>` + railOverdue.slice(0, 8).map(railTask).join('') : '') +
        (railDueToday.length ? `<div class="rail-group soon">Due today</div>` + railDueToday.slice(0, 8).map(railTask).join('') : '');
      fill('r-tasks', taskHtml, 'Nothing overdue or due today.');

      // ----- Client documents: what clients have sent in -----
      // Read off the activity entries already fetched above rather than a new
      // endpoint. Each row deep-links straight to that contact's Documents tab,
      // because "a document arrived" is only useful if opening it is one click.
      const sentDocs = (actData.entries || [])
        .filter((e) => e.type === 'document-uploaded')
        .slice(0, 8);
      fill('r-docs', sentDocs.map((e) => {
        const d = e.detail || {};
        const name = escapeHtml(d.name || d.filename || 'Document');
        return `<a class="rail-row" style="text-decoration:none;color:inherit"
          href="/admin/contacts.html?c=${encodeURIComponent(e.client || '')}&tab=documents">
          <div class="rr-main">
            <div class="rr-title">${name}</div>
            <div class="rr-rel">${escapeHtml(contactName(e.client))} · ${escapeHtml(relTime(e.ts))}</div>
          </div>
        </a>`;
      }).join(''), 'No documents sent in recently.');

      // Completed onboardings whose advisory agreement is still unsigned. The
      // Queues card that also counted these is gone; the Compliance alerts
      // below still name each one individually, so the signal is not lost.
      const unsigned = onbs.filter((r) => r.completionTime && !(r.data && r.data.agreement && r.data.agreement.signatureDataUrl));

      // ----- Special dates: whatever falls inside the next 30 days -----
      // upcomingImportantDate honours each entry's repeatsAnnually flag, so a
      // one-off drops off this list for good once its date passes instead of
      // coming back every year like a birthday.
      const upcoming = [];
      contacts.forEach((c) => {
        (c.importantDates || []).forEach((d) => {
          const next = upcomingImportantDate(d, now);
          if (next && next.days <= 30) upcoming.push({ contact: c, label: d.label, next });
        });
      });
      upcoming.sort((a, b) => a.next.days - b.next.days);
      fill(
        'r-dates',
        upcoming
          .map((u) => {
            const when = u.next.days === 0 ? 'Today' : u.next.days === 1 ? 'Tomorrow'
              : u.next.date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            return `<a class="rail-row" style="text-decoration:none;color:inherit" href="/admin/contacts.html?c=${encodeURIComponent(u.contact.email)}">
              <div class="rr-main">
                <div>${escapeHtml(u.contact.name || u.contact.email)}</div>
                <div class="rr-sub">${escapeHtml(u.label || 'Date')}</div>
              </div>
              <span class="sd-when">${escapeHtml(when)}</span>
            </a>`;
          })
          .join(''),
        'No dates in the next 30 days.'
      );

      // ----- Compliance alerts (rule-based) -----
      const alerts = [];
      unsigned.forEach((r) => alerts.push({
        level: 'red',
        text: `Onboarding ${r.onboardingId} is complete but the advisory agreement is unsigned.`,
        href: `/admin/onboarding.html?id=${encodeURIComponent(r.onboardingId)}`,
      }));
      (adminData.admins || []).filter((a) => !a.mfaEnabled).forEach((a) => alerts.push({
        level: 'red',
        text: `Admin ${a.email} has not set up two-factor authentication.`,
        href: '/admin/settings.html',
      }));
      contacts.filter((c) => c.hasAccount && c.status === 'active').forEach((c) => {
        let newest = c.updatedAt || null;
        Object.values(c.modules || {}).forEach((m) => {
          if (m && m.updatedAt && (!newest || m.updatedAt > newest)) newest = m.updatedAt;
        });
        if (newest && (now - new Date(newest)) > 90 * 86400e3) {
          alerts.push({
            level: 'amber',
            text: `${c.name || c.email}: no recorded activity in over 90 days.`,
            href: `/admin/contacts.html?c=${encodeURIComponent(c.email)}`,
          });
        }
      });
      fill('r-alerts', alerts.map((a) => `
        <a class="alert-item" style="text-decoration:none;color:inherit" href="${a.href}">
          <span class="alert-dot" style="background:var(--${a.level === 'red' ? 'red' : 'amber'})"></span>
          <span>${escapeHtml(a.text)}</span>
        </a>`).join(''), 'No compliance alerts. All clear.');

      // Complete-from-home checkboxes
      document.querySelectorAll('.task-check').forEach((cb) =>
        cb.addEventListener('change', async () => {
          document.getElementById('dash-status').textContent = '';
          try {
            await api(`/api/admin/tasks/${encodeURIComponent(cb.dataset.id)}`, {
              method: 'POST', body: JSON.stringify({ status: 'done' }),
            });
            load();
          } catch (err) {
            // The 30s poll may have replaced this row mid-request, leaving `cb`
            // detached — unchecking it would then be invisible. Report the
            // failure somewhere that survives a re-render, and reload so the
            // list reflects real server state either way.
            cb.checked = false;
            document.getElementById('dash-status').textContent = `Could not complete task: ${err.message}`;
            load();
          }
        })
      );
    } catch (err) {
      document.getElementById('feed').innerHTML = `<p class="empty">Failed to load: ${escapeHtml(err.message)}</p>`;
    }
  }

  document.getElementById('dash-refresh').addEventListener('click', () => {
    feedExtra = []; // an explicit refresh collapses back to the newest page
    load();
  });
  // Don't let the background poll yank the feed out from under someone who is
  // reading paged-in history or mid-sentence in the composer.
  setInterval(() => {
    if (feedExtra.length || textEl.value.trim()) return;
    load();
  }, 30000);
  load();
</script>
</body>
</html>
