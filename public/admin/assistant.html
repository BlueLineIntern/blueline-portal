<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/assets/blueline-logo.png" type="image/png" />
<title>Assistant — BlueLine Admin</title>
<link rel="stylesheet" href="/assets/style.css" />
<link rel="stylesheet" href="/admin/shared.css" />
<style>
  .chat-panel { border: 1px solid var(--border); border-radius: var(--radius); background: #fff; display: flex; flex-direction: column; height: calc(100vh - 200px); min-height: 380px; }
  .chat-log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .chat-turn { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .chat-turn.user { align-self: flex-end; background: var(--navy); color: #fff; border-bottom-right-radius: 3px; }
  .chat-turn.bot { align-self: flex-start; background: var(--bg, #f4f6f9); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .chat-turn.err { align-self: flex-start; background: #fdf2f2; border: 1px solid #f0c4c4; color: #8a1f1f; }
  .chat-writes { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 0.8rem; }
  .chat-writes strong { display: block; margin-bottom: 3px; }
  .chat-empty { color: var(--muted); text-align: center; margin: auto 0; line-height: 1.7; }
  .chat-empty code { background: #eef1f5; padding: 1px 6px; border-radius: 4px; }
  .chat-form { border-top: 1px solid var(--border); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-end; }
  .chat-form textarea { flex: 1; resize: none; min-height: 42px; max-height: 160px; font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; }
  .chat-thinking { align-self: flex-start; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar-root"></aside>
  <main class="content">
    <div class="page-head">
      <div>
        <h1>Assistant</h1>
        <p class="sub">Ask about clients, tasks, meetings, and notes — or have it create a task,
        schedule a meeting, or file a note. It reads only this portal's data, and anything it
        creates is written to the audit log under your name.</p>
      </div>
      <div class="page-actions">
        <span class="panel-status" id="chat-status"></span>
        <button type="button" class="btn btn-ghost btn-small" id="chat-clear">Clear</button>
      </div>
    </div>

    <div class="chat-panel">
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-form">
        <textarea id="chat-input" rows="1" placeholder="Ask about a client, or say what you want created…"></textarea>
        <button type="button" class="btn btn-primary" id="chat-send">Send</button>
      </div>
    </div>
  </main>
</div>

<script src="/admin/shared.js"></script>
<script>
  initShell('assistant');

  // History lives only in this tab. Each send posts the prior turns so the
  // assistant has context; nothing is persisted server-side.
  let history = [];
  let busy = false;

  const logEl = document.getElementById('chat-log');
  const inputEl = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');
  const statusEl = document.getElementById('chat-status');

  const EMPTY_HTML = `<div class="chat-empty">
    Try: <code>show my overdue tasks</code> ·
    <code>how many modules does the Smith household still need?</code> ·
    <code>summarize my notes on joshuab823@comcast.net</code>
  </div>`;

  function render() {
    if (!history.length) {
      logEl.innerHTML = EMPTY_HTML;
      return;
    }
    logEl.innerHTML = history
      .map((t) => {
        const cls = t.role === 'user' ? 'user' : t.error ? 'err' : 'bot';
        const writes = (t.writes || []).length
          ? `<div class="chat-writes"><strong>Created</strong>${t.writes
              .map((w) => escapeHtml(`${w.action.replace(/_/g, ' ')}${w.title ? `: ${w.title}` : ''}${w.client ? ` (${w.client})` : ''}`))
              .join('<br>')}</div>`
          : '';
        return `<div class="chat-turn ${cls}">${escapeHtml(t.content)}${writes}</div>`;
      })
      .join('');
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    // Only text turns go back to the server — the writes annotation is local.
    const priorTurns = history
      .filter((t) => !t.error)
      .map((t) => ({ role: t.role, content: t.content }));

    history.push({ role: 'user', content: text });
    render();
    logEl.insertAdjacentHTML('beforeend', '<div class="chat-thinking" id="chat-thinking">Thinking…</div>');
    logEl.scrollTop = logEl.scrollHeight;
    statusEl.textContent = '';

    try {
      const data = await api('/api/admin/assistant', {
        method: 'POST',
        body: JSON.stringify({ message: text, history: priorTurns }),
      });
      history.push({ role: 'assistant', content: data.reply, writes: data.writes || [] });
      if (data.truncated) statusEl.textContent = 'The answer may be cut short — try a narrower question.';
    } catch (err) {
      // A failed run can still have written something before it died, so keep
      // any writes the server reported rather than implying nothing happened.
      history.push({
        role: 'assistant',
        content: err.message,
        writes: (err.data && err.data.writes) || [],
        error: true,
      });
    } finally {
      busy = false;
      sendBtn.disabled = false;
      render();
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });
  document.getElementById('chat-clear').addEventListener('click', () => {
    history = [];
    statusEl.textContent = '';
    render();
  });

  render();
  inputEl.focus();
</script>
</body>
</html>
